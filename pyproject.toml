[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "networking"
version = "1.0.0"
description = "Socket-Server und -Client mit Nachrichten-Framing, dazu Request/Event-Kommunikation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
networking = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
