[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "networking"
version = "1.1.1"
description = "Socket-Server und -Client mit Nachrichten-Framing, dazu Request/Event-Kommunikation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
networking = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:pkg_resources is deprecated:UserWarning"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
packages = ["networking"]
